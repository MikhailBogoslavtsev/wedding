  /* ─── Botanical SVG overlays ─── */
  .botanical {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* ─── Main content ─── */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0 96px; /* 5% safe zone */
  }

  .tagline {
    font-family: 'Raleway', sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 0.35em;
    color: #8a7d6a;
    text-transform: uppercase;
    margin-bottom: 52px;
  }
